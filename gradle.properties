#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#typst-kmp
# Cargo profile used for the native builds ("release" or "dev").
typst.cargoProfile=release
# Set to a directory containing prebuilt native artifacts to skip invoking cargo.
# Layout: <dir>/<rustTarget>/<artifact>, and for the web target additionally
# <dir>/wasm32-unknown-unknown/bindgen/ for the wasm-bindgen output. Used by the CI publish job.
#typst.prebuiltDir=
# Set to false to build the WebAssembly module without the bundled fonts: 31 MB instead of 40 MB,
# leaving TypstConfig.fonts to supply what the document needs. Every other platform embeds them
# unconditionally, so this is the one flag that changes what embedDefaultFonts means.
#typst.wasmEmbedFonts=false

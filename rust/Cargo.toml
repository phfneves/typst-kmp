[workspace]
resolver = "2"
members = [
    "typst-kmp-core",
    "typst-kmp-cabi",
    "typst-kmp-jni",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/phfneves/typst-kmp"

[workspace.dependencies]
typst = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-render = "0.15"
typst-eval = "0.15"
typst-layout = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NEVER set `panic = "abort"` here: this library is loaded into a host runtime (the JVM, or a
# Kotlin/Native binary) and unwinding across the FFI boundary is undefined behaviour. Every
# entry point in typst-kmp-cabi / typst-kmp-jni wraps its body in `catch_unwind` instead.
panic = "unwind"

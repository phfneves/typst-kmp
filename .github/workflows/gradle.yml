name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test --workspace
      # typst-kmp-wasm has no tests of its own — it is the same facade as the other two over the
      # same core — but it is the only crate whose target is not the host's, so nothing else would
      # notice an upstream dependency losing wasm support.
      - name: Check the wasm facade
        if: matrix.os == 'ubuntu-latest'
        working-directory: rust
        run: cargo clippy --package typst-kmp-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  kotlin:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # jvmJarTest runs the same suite against the assembled jars, so the resource lookup the
          # published artifacts rely on is exercised too. Windows is where a classifier or library
          # naming bug would hide, so it runs there as well.
          # `artifact` is the job name as an upload-artifact name: that API rejects a slash, and
          # expressions have no replace() to derive one from `name`.
          - name: JVM (Linux)
            artifact: jvm-linux
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            tasks: :typst:jvmTest :typst:jvmJarTest :typst:jvmNativeJars
            native-classifier: linux-x86_64
            native-library: libtypst_kmp_jni.so
          - name: JVM (Windows)
            artifact: jvm-windows
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tasks: :typst:jvmTest :typst:jvmJarTest
          - name: Kotlin/Native (Linux)
            artifact: native-linux
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            tasks: :typst:linuxX64Test
          - name: Kotlin/Native (Windows)
            artifact: native-windows
            os: windows-latest
            rust-targets: x86_64-pc-windows-gnu
            tasks: :typst:mingwX64Test
          - name: Kotlin/Native (Apple)
            artifact: native-apple
            os: macos-latest
            rust-targets: aarch64-apple-darwin,aarch64-apple-ios-sim
            tasks: :typst:macosArm64Test :typst:iosSimulatorArm64Test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test
        run: ./gradlew ${{ matrix.tasks }}
      # jvmJarTest would still pass if the two jars merged back into one fat jar — only this
      # notices. Linux only: it needs unzip, which the Git Bash on windows-latest does not carry.
      # Version-agnostic globbing, because no job pins -Ptypst.version.
      - name: Verify the JVM jars are split by platform
        if: matrix.native-classifier != ''
        run: |
          libs=typst/build/libs
          prefix=io/github/phfneves/typst/native
          main=$(find "$libs" -maxdepth 1 -name 'typst-jvm-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-all.jar' \
            ! -name '*-linux-*.jar' ! -name '*-macos-*.jar' ! -name '*-windows-*.jar')
          [ -f "$main" ] || { echo "expected exactly one main jvm jar, got: $main"; exit 1; }
          leaked=$(unzip -Z1 "$main" | grep "^$prefix/" || true)
          if [ -n "$leaked" ]; then
            echo "the main jar still carries native libraries:"; echo "$leaked"; exit 1
          fi
          echo "ok: $(basename "$main") is classes only ($(du -h "$main" | cut -f1))"
          # The 'all' jar legitimately holds only this runner's library: without -Ptypst.prebuiltDir
          # the host is the only platform cargo can produce. publish.yml checks it is complete.
          for classifier in ${{ matrix.native-classifier }} all; do
            jar=$(find "$libs" -maxdepth 1 -name "typst-jvm-*-$classifier.jar")
            [ -f "$jar" ] || { echo "missing classifier jar for '$classifier'"; exit 1; }
            # Directory entries are listed too, and carry a trailing slash; drop them.
            entries=$(unzip -Z1 "$jar" | grep "^$prefix/" | grep -v '/$' || true)
            expected="$prefix/${{ matrix.native-classifier }}/${{ matrix.native-library }}"
            [ "$entries" = "$expected" ] \
              || { echo "$jar holds '$entries', expected '$expected' alone"; exit 1; }
            echo "ok: $(basename "$jar") -> $entries ($(du -h "$jar" | cut -f1))"
          done
      # Each suite compiles src/commonTest/typst/report.typ and writes the PDF here, so a failure
      # can be looked at rather than guessed at.
      #
      # Still `always()`, because a PDF left behind by a failing run is exactly what this is for.
      # But the strictness has to follow the job: on a green run a missing PDF means the artifact
      # mechanism broke and should fail; on a red one it usually just means the suite never got
      # that far, and erroring buries the failure that matters under an upload error of its own.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-${{ matrix.artifact }}
          path: typst/build/test-artifacts/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  web:
    name: Web (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The CLI and the wasm-bindgen crate must be the exact same version; WasmBindgenTask checks
      # it and says so, but pinning here is what keeps the check quiet. Read from the crate's own
      # manifest so this never drifts from the pin.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -oP 'wasm-bindgen = "=\K[0-9.]+' rust/typst-kmp-wasm/Cargo.toml)
          echo "Installing wasm-bindgen-cli $version"
          cargo install wasm-bindgen-cli --locked --version "$version"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The same 13-test commonTest suite the other jobs run, this time in a real browser with the
      # engine in a Web Worker. No PDF is uploaded afterwards: a browser has nowhere to write one,
      # which is why `writeTestArtifact` returns null on these targets.
      - name: Run the common suite in Chrome
        run: ./gradlew :typst:jsBrowserTest :typst:wasmJsBrowserTest

  android:
    name: Android (assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Pinned to the major version: cargo-ndk 4 renamed the API-level flag to -P and stopped
      # tolerating a --target passed through to cargo. A silent CLI change breaks the build.
      - run: cargo install cargo-ndk --locked --version '^4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Only the Android target: `:typst:assemble` would also build the Linux Kotlin/Native
      # targets, whose Rust triples this job does not install.
      #
      # The common tests cannot run as `androidHostTest`: the Android loader calls
      # System.loadLibrary, which a plain JVM cannot satisfy. The `emulator` job below runs the
      # identical suite on a real ABI instead; here we only prove the libraries land in the AAR.
      - name: Assemble
        run: ./gradlew :typst-android-native:assembleRelease :typst:assembleAndroidMain
      - name: Verify the AAR carries every ABI, with the JNI entry points exported
        run: |
          aar=typst-android-native/build/outputs/aar/typst-android-native-release.aar
          unzip -o -q "$aar" 'jni/*' -d aar-check
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="aar-check/jni/$abi/libtypst_kmp_jni.so"
            [ -f "$so" ] || { echo "missing $abi in $aar"; exit 1; }
            grep -aq 'Java_io_github_phfneves_typst_internal_TypstNative_compile' "$so" \
              || { echo "$abi library does not export the JNI entry points"; exit 1; }
            echo "ok: $abi ($(du -h "$so" | cut -f1))"
          done

  emulator:
    name: Android (instrumented)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only the emulator's own ABI is needed here; the `android` job covers the other two.
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo install cargo-ndk --locked --version '^4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the common suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Only the emulator's ABI, so the job does not build the other two for nothing.
          script: ./gradlew :typst:connectedAndroidDeviceTest -Ptypst.androidAbis=x86_64
      # The suite writes its PDF to the runner argument `additionalTestOutputDir`, so AGP pulls it
      # off the device by itself — the app is uninstalled immediately after the run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-pdf
          path: typst/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error

  demo:
    name: Demo (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # No Rust toolchain and no cargo-ndk here on purpose. `typst.skipCargo` leaves the native
      # artifacts out, which is all this job needs: it exists to catch the demo drifting away from
      # the library's API, and the jobs above are what prove the native side works.
      # The web distributions are built too, but only compiled: without a Rust toolchain the
      # `typst-kmp/` directory they copy in is empty, so they would load but not compile anything.
      - name: Compile the demo against the library
        run: >
          ./gradlew -p demo :desktopApp:assemble :androidApp:assembleDebug
          :webApp:jsBrowserDistribution :webApp:wasmJsBrowserDistribution
          -Ptypst.skipCargo=true

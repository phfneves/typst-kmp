name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test --workspace
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  kotlin:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JVM (Linux)
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            tasks: :typst:jvmTest
          - name: JVM (Windows)
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tasks: :typst:jvmTest
          - name: Kotlin/Native (Linux)
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            tasks: :typst:linuxX64Test
          - name: Kotlin/Native (Windows)
            os: windows-latest
            rust-targets: x86_64-pc-windows-gnu
            tasks: :typst:mingwX64Test
          - name: Kotlin/Native (Apple)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,aarch64-apple-ios-sim
            tasks: :typst:macosArm64Test :typst:iosSimulatorArm64Test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test
        run: ./gradlew ${{ matrix.tasks }}

  android:
    name: Android (assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The common tests cannot run as `androidHostTest`: the Android loader calls
      # System.loadLibrary, which a plain JVM cannot satisfy. Coverage for Android comes from the
      # instrumented device test instead; here we only prove the .so lands in the AAR.
      - name: Assemble
        run: ./gradlew :typst-android-native:assemble :typst:assemble
      - name: Verify the AAR carries every ABI
        run: |
          aar=$(find typst-android-native/build/outputs/aar -name '*.aar' | head -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$aar" | grep -q "jni/$abi/libtypst_kmp_jni.so" \
              || { echo "missing $abi in $aar"; exit 1; }
          done

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test --workspace
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  kotlin:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JVM (Linux)
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            tasks: :typst:jvmTest
          - name: JVM (Windows)
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tasks: :typst:jvmTest
          - name: Kotlin/Native (Linux)
            os: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            tasks: :typst:linuxX64Test
          - name: Kotlin/Native (Windows)
            os: windows-latest
            rust-targets: x86_64-pc-windows-gnu
            tasks: :typst:mingwX64Test
          - name: Kotlin/Native (Apple)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,aarch64-apple-ios-sim
            tasks: :typst:macosArm64Test :typst:iosSimulatorArm64Test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test
        run: ./gradlew ${{ matrix.tasks }}

  android:
    name: Android (assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Pinned to the major version: cargo-ndk 4 renamed the API-level flag to -P and stopped
      # tolerating a --target passed through to cargo. A silent CLI change breaks the build.
      - run: cargo install cargo-ndk --locked --version '^4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Only the Android target: `:typst:assemble` would also build the Linux Kotlin/Native
      # targets, whose Rust triples this job does not install.
      #
      # The common tests cannot run as `androidHostTest` either: the Android loader calls
      # System.loadLibrary, which a plain JVM cannot satisfy. Coverage for Android comes from the
      # instrumented device test; here we only prove the libraries land in the AAR.
      - name: Assemble
        run: ./gradlew :typst-android-native:assembleRelease :typst:assembleAndroidMain
      - name: Verify the AAR carries every ABI, with the JNI entry points exported
        run: |
          aar=typst-android-native/build/outputs/aar/typst-android-native-release.aar
          unzip -o -q "$aar" 'jni/*' -d aar-check
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="aar-check/jni/$abi/libtypst_kmp_jni.so"
            [ -f "$so" ] || { echo "missing $abi in $aar"; exit 1; }
            grep -aq 'Java_io_github_phfneves_typst_internal_TypstNative_compile' "$so" \
              || { echo "$abi library does not export the JNI entry points"; exit 1; }
            echo "ok: $abi ($(du -h "$so" | cut -f1))"
          done
